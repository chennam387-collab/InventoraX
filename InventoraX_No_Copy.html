<script id="inventorax-copy-protection-script">
(function () {
  function inEditable(el) {
    return !!(el && el.closest && el.closest('input, textarea, select, [contenteditable="true"]'));
  }
  document.addEventListener('contextmenu', function (e) {
    if (!inEditable(e.target)) e.preventDefault();
  });
  document.addEventListener('copy', function (e) {
    if (!inEditable(e.target)) e.preventDefault();
  });
  document.addEventListener('cut', function (e) {
    if (!inEditable(e.target)) e.preventDefault();
  });
  document.addEventListener('keydown', function (e) {
    if (inEditable(e.target)) return;
    if ((e.ctrlKey || e.metaKey) && ['c','x','u','s','p','a'].includes(e.key.toLowerCase())) {
      e.preventDefault();
    }
  });
})();

const CN={robotics:["A robot is a loop of sensing, thinking and acting. Every robot you build later uses these three parts.","A complete loop lets current flow, and sensors change that flow so a robot can notice its surroundings.","Gears let you choose between speed and strength. Pick the ratio that suits the job.","Code turns sensor readings into decisions, which is what lets a robot act on its own.","Two sensors and a simple rule are enough to follow a line. Better rules give smoother, faster laps.","Feedback control corrects errors smoothly. Tuning P, I and D balances speed against stability.","Matching voltage and checking the drop under load keeps motors running safely and reliably.","Servos give exact angles, so combining them with arms lets a robot pick up and place objects.","Sensing distance and choosing a reaction is the basis of how robots move safely around obstacles."],physics:["Speed links distance and time. Measuring both lets you describe any motion with numbers.","Mass, force and acceleration are linked. The same push moves a lighter object faster.","Friction depends on the surface and the load, so choose wheel material to suit the ground.","Launch angle and speed together decide the range. About 45 degrees gives the longest throw.","Energy changes form but is not created. Losses to air and friction slowly stop the pendulum.","Torque grows with both force and distance from the pivot, so longer levers need less force.","Gravity pulls all objects equally. Air resistance is why paper falls slower than a ball.","Simple machines trade force for distance, so a small effort can lift a big load.","Momentum is conserved in collisions, so heavier objects change the motion of lighter ones more."]};

const HW={robotics:[["t|A robot needs a power source such as a battery.|true|Nothing moves without energy.","t|A sensor is the part that makes the wheels turn.|false|Motors turn wheels. Sensors detect.","t|A switch can turn a robot's circuit on and off.|true|Think of a light switch.","o|Odd one out: motor, wheel, spoon, battery|spoon|Three of them are robot parts.","o|Odd one out: sensor, wire, cloud, switch|cloud|Pick the one that is not a part.","t|The red wire of a battery pack is usually positive.|true|Red means plus.","t|A robot can only be built from metal.|false|Plastic, wood and cardboard work too."],["t|A servo motor can turn to an exact angle.|true|That is what servos are for.","t|In a series circuit, current has more than one path.|false|Series has one path.","o|Odd one out (not a controller): Arduino, microcontroller, resistor, Raspberry Pi|resistor|A resistor only limits current.","t|A big gear driving a small gear makes the small gear spin faster.|true|Fewer teeth turn more times.","o|Odd one out (not an output): motor, LED, buzzer, light sensor|light sensor|Outputs do something. Sensors detect.","t|An ultrasonic sensor measures distance using sound.|true|It sends a sound pulse and times the echo.","t|A resistor increases the current in a circuit.|false|It limits the current."],["t|PID control uses feedback to reduce error.|true|P, I and D all work on the error.","t|An encoder measures how far a wheel has turned.|true|It counts tiny steps of rotation.","o|Odd one out (not a sensor): encoder, gyroscope, ultrasonic, gearbox|gearbox|A gearbox changes speed and torque.","t|More motor power always makes a robot more accurate.|false|Accuracy needs control, not just power.","t|A robot that senses and corrects itself uses a feedback loop.|true|Sense, compare, correct.","o|Odd one out (not programming): loop, variable, battery, condition|battery|It is hardware, not code.","t|Autonomous means a person controls the robot at all times.|false|Autonomous means it decides by itself."]],physics:[["t|Gravity pulls objects toward the Earth.|true|It is why things fall.","t|With no air, a heavier object falls faster than a light one.|false|All objects fall equally.","o|Odd one out: speed, force, banana, time|banana|Three are physics quantities.","t|Friction makes a sliding object slow down.|true|It resists motion.","o|Odd one out (not a unit): metre, second, kilogram, table|table|Units measure things.","t|Energy can be created from nothing.|false|It only changes form.","t|A moving object has kinetic energy.|true|Kinetic means motion."],["t|Force is measured in newtons.|true|Named after Isaac Newton.","t|Mass and weight mean exactly the same thing.|false|Weight is the pull of gravity on mass.","o|Odd one out (not a simple machine): lever, pulley, ramp, battery|battery|The others make work easier.","t|A longer lever needs less force to lift the same load.|true|Force × distance balances.","t|Speed has a direction.|false|Velocity has direction.","o|Odd one out (not a type of energy): heat, light, sound, chair|chair|You cannot feel chair energy.","t|Friction can turn motion into heat.|true|Rub your hands together."],["t|Momentum equals mass times velocity.|true|p = m × v.","t|Total momentum is lost in every collision.|false|It is conserved.","o|Odd one out (not a vector): force, velocity, mass, acceleration|mass|Mass has no direction.","t|A projectile's horizontal speed stays steady if air is ignored.|true|Only gravity acts, and it acts downward.","t|Torque depends only on force, not on distance from the pivot.|false|Torque = force × distance.","t|At the top of its path, a thrown ball's vertical speed is zero for an instant.|true|It stops rising before it falls.","t|A pendulum's swing time depends strongly on how heavy the weight is.|false|Length matters most."]]};

AD("robotics",0,"Switches and buttons","How a switch opens and closes a circuit to control a part.","Make an LED that lights only while the button is pressed.","A switch opens or closes a circuit. When it is open there is a gap and no current flows. When it is closed the loop is complete and current flows.","2 AA battery holder, push button, red LED, 220 ohm resistor, wires",["Join the battery's red wire to one terminal of the push button.","Join the other button terminal to one end of the resistor.","Join the other end of the resistor to the LED's long leg.","Join the LED's short leg to the battery's black wire.","Press the button and the LED lights. Release it and the LED goes off."],"A switch decides whether the circuit is complete, so it decides when a robot part works.");
AD("robotics",0,"Buzzers and sound","How a buzzer turns electricity into sound.","Make a buzzer that sounds when a switch is closed.","A buzzer is an output part that turns electrical energy into sound. It has a positive and a negative side, so it must be connected the right way round.","2 AA battery holder, 3 V active buzzer, switch, wires",["Join the battery's red wire to one terminal of the switch.","Join the other switch terminal to the buzzer's positive leg (marked +).","Join the buzzer's other leg to the battery's black wire.","Close the switch and the buzzer sounds. Open it and the sound stops."],"Output parts like buzzers need correct polarity, and they tell us what the robot is doing.");
AD("robotics",0,"Series and parallel circuits","Two ways to connect parts and how brightness changes.","Build both circuits and compare how bright the LEDs are.","In a series circuit the parts share one path and the same current. In a parallel circuit each branch has its own path and gets the full battery voltage.","4 AA battery holder (6 V), 2 red LEDs, 2 resistors of 330 ohm, breadboard, wires",["Series: join battery + to one resistor, then to LED 1 long leg.","Join LED 1 short leg to LED 2 long leg, then LED 2 short leg to battery -. Note the brightness.","Parallel: give each LED its own 330 ohm resistor.","Join both resistor ends to battery +, and both LED short legs to battery -.","Compare the brightness with the series circuit."],"Parallel wiring keeps every part at full voltage, so most robot parts are wired in parallel from the battery.");
AD("robotics",0,"Using a multimeter","How to measure voltage and resistance safely.","Measure the battery voltage and the value of one resistor.","A multimeter measures voltage, current and resistance. Voltage is measured across a part, while resistance must be measured with the part removed and no power on.","Multimeter, 2 AA battery holder, 220 ohm resistor, wires",["Turn the dial to DC voltage (the 20 V range).","Touch the red probe to the red wire and the black probe to the black wire. Read about 3 V.","Turn the dial to resistance (ohms) and take the resistor out of any circuit.","Touch one probe to each end of the resistor and read about 220 ohms.","Never measure resistance on a circuit that has power."],"Measuring shows what is really happening in a circuit and helps you find faults.");
AD("robotics",0,"Dimmer with a potentiometer","How a variable resistor changes brightness.","Make an LED that can be dimmed and brightened with a knob.","A potentiometer is a resistor you can change by turning a knob. More resistance means less current, so an LED gets dimmer.","3 AA battery holder (4.5 V), 10k potentiometer, red LED, 330 ohm resistor, wires",["Join battery + to the potentiometer's left outer pin.","Join the potentiometer's middle pin to one end of the 330 ohm resistor.","Join the other resistor end to the LED's long leg.","Join the LED's short leg to battery -.","Turn the knob slowly and watch the brightness change."],"Variable resistance is how dials and volume controls adjust a robot part smoothly.");
AD("robotics",0,"Simple DC motor","How current direction controls a motor's spin.","Reverse a motor's direction by swapping two wires.","A DC motor spins when current flows through it. Reversing the wires reverses the spin, and a higher voltage makes it spin faster.","2 AA battery holder, small DC motor, switch, wires",["Join the battery's red wire to one terminal of the switch.","Join the other switch terminal to motor terminal A.","Join motor terminal B to the battery's black wire.","Close the switch and watch the direction of spin.","Swap the two motor wires and close the switch again. The motor now spins the other way."],"A motor's speed depends on voltage and its direction on the current direction, which is how robots drive forward and backward.");
AD("robotics",0,"Building a robot chassis","How to build a balanced base for a two-wheel robot.","Build a chassis that rolls in a straight line.","The chassis is the frame that holds the motors, wheels and battery. A common design uses two driven wheels and one free caster wheel for balance.","Cardboard or acrylic base 15 x 10 cm, 2 gear motors with wheels, caster wheel, 4 AA battery holder, switch, double-sided tape, wires",["Cut the base to size and mark the centre line.","Fix one motor on the left and one on the right with brackets or strong tape, shafts pointing outward, and press the wheels on.","Fix the caster wheel at the front, on the centre line.","Fix the battery holder in the middle so the weight is balanced.","Wire the battery red wire to the switch, then to terminal A of both motors. Join terminal B of both motors to the battery black wire.","Switch on and check that it rolls straight."],"A balanced chassis with two driven wheels and one free caster is the base of most small robots.");
AD("robotics",0,"Reading a circuit diagram","How symbols and lines map to real parts.","Draw a circuit diagram, then build the circuit from it.","A circuit diagram uses symbols for the battery, switch, resistor, LED and motor, and lines for wires. Follow the lines from the positive side round to the negative side.","Paper, pencil, ruler, battery holder, switch, LED, resistor, wires",["Look at the parts and draw the battery symbol first.","Draw lines for wires and add the switch, resistor and LED symbols in the same order as the real parts.","Check that the drawing makes a closed loop from + to -.","Wire the real circuit by following your drawing.","Close the switch and check that the LED lights."],"A circuit diagram is a map. Drawing it first prevents wiring mistakes.");
AD("robotics",0,"Batteries in series and parallel","How joining cells changes voltage and running time.","Measure the voltage of cells joined in series and in parallel.","Cells joined in series (+ to -) add their voltages. Cells joined in parallel (+ to + and - to -) keep the same voltage but last longer.","2 fresh AA cells of the same type, 2 single-cell holders, multimeter, small DC motor, wires",["Measure one cell with the multimeter on DC volts. You should read about 1.5 V.","Series: join the + of cell 1 to the - of cell 2 and measure across the two free ends. Read about 3 V.","Parallel: join + to + and - to -, then measure across the pair. Read about 1.5 V.","Run the motor from the series pair, then from one cell, and compare the speed."],"Series adds voltage for more speed and power. Parallel adds running time at the same voltage.");
AD("robotics",0,"Making safe wire joints","How to strip, twist and connect wires without soldering.","Join two wires so they stay firmly connected when pulled gently.","A loose joint is the most common cause of a robot that does not work. A good joint is clean metal touching clean metal, held firmly and covered so it cannot touch other wires.","Wire, wire stripper, screw terminal block, insulation tape, screwdriver",["Strip about 1 cm of insulation from each wire end, taking care not to cut the metal strands.","Twist the strands of each wire tightly.","Push each end into one side of the terminal block and tighten the screw.","Tug each wire gently to check that it is firm.","Cover any bare metal with tape."],"Firm, covered joints prevent loose-connection faults and short circuits.");
AD("robotics",0,"Bump switch","How a lever switch tells a robot it has touched something.","Make a buzzer that sounds when the lever is pressed.","A micro switch has a small lever. Pressing the lever connects the common terminal (COM) to the normally-open terminal (NO), which completes the circuit.","Micro switch with lever, buzzer, 2 AA battery holder, wires",["Join the battery's red wire to the COM terminal of the micro switch.","Join the NO terminal to the buzzer's positive leg.","Join the buzzer's other leg to the battery's black wire.","Press the lever and the buzzer sounds. Release it and the sound stops."],"Bump switches let a robot know when it has hit an obstacle.");
AD("robotics",0,"LED traffic light","How parallel branches with their own switches control parts separately.","Build a traffic light where each colour has its own button.","Each LED needs its own resistor. When each LED and its resistor form a separate branch from the battery, they can be switched on and off independently.","3 AA battery holder (4.5 V), red, yellow and green LEDs, 3 resistors of 330 ohm, 3 push buttons, breadboard, wires",["Join battery + to a power rail on the breadboard and battery - to a ground rail.","For each colour: join the power rail to a button, the button to a 330 ohm resistor, the resistor to the LED's long leg.","Join each LED's short leg to the ground rail.","Press each button to light its LED. Press two at once to see that they work separately."],"Parallel branches with their own switches let you control each part independently.");
AD("robotics",0,"Choosing an LED resistor","How to calculate the right resistor value for an LED.","Calculate a resistor for a red LED on 4.5 V and check it.","An LED needs a resistor to limit current. Resistor = (supply voltage - LED voltage) ÷ current. A red LED uses about 2 V and 10 mA, so (4.5 - 2) ÷ 0.01 = 250 ohms. The nearest common value, 330 ohm, is safe.","3 AA battery holder (4.5 V), red LED, resistors of 330 ohm and 1000 ohm, multimeter, wires",["Calculate the resistor for your supply using the formula.","Build battery +, then resistor (330 ohm), then LED long leg, then LED short leg, then battery -.","Note the brightness. Swap in the 1000 ohm resistor and compare.","Never connect an LED directly to a battery without a resistor."],"The resistor protects the LED, and the formula tells you how big it should be.");
AD("robotics",0,"Wheel size and distance","How wheel size changes how far a robot goes per turn.","Measure the distance travelled for two wheel sizes.","Distance per turn = wheel circumference. A larger wheel covers more ground per turn, but needs more turning force from the motor.","Chassis with motors, 2 sizes of wheels, tape measure, battery pack, stopwatch",["Mark a start line on the floor.","Fit the small wheels and run the robot for 5 seconds. Measure the distance.","Swap to the large wheels and run again for 5 seconds. Measure the distance.","Compare the two distances and the pulling strength."],"Wheel size trades distance and speed against pulling force.");
AD("robotics",0,"Hydraulic robot arm","How liquid in tubes can move an arm without a motor.","Build an arm that moves when you push a syringe.","Liquid cannot be squashed, so pushing one syringe sends the force through the tube and moves the other syringe. This is how digger arms work.","2 syringes (no needles), clear tube, water, cardboard, tape, craft sticks",["Fill both syringes and the tube with water so no air bubbles remain.","Join the syringes with the tube.","Tape the second syringe to a cardboard arm so its plunger pushes the arm up.","Push the first syringe slowly and watch the arm lift."],"Fluids carry force through tubes, which is how hydraulic robot arms and diggers move.");
AD("robotics",0,"Workshop safety","Safe habits for building and testing robots.","Complete a safety checklist before building your next circuit.","Most robot accidents come from habits, not from the parts. Low-voltage batteries are safe, but short circuits can make wires hot, and tools can hurt if used carelessly.","Safety glasses, screwdriver, wire stripper, insulation tape, ruler",["Check the + and - of the battery before connecting anything.","Disconnect the battery before changing any wires.","Keep loose metal away from the battery terminals.","Never use mains-powered parts in student projects.","Keep wires tidy and test with the switch off first."],"Safe habits protect people and parts, and they make building faster.");

AD("maths",0,"Place value","What each digit in a number is worth.","Write 3,507 in expanded form.","Each digit has a value based on its place: ones, tens, hundreds and so on. In 345 the 3 means 300, the 4 means 40 and the 5 means 5.","digit, ones, tens, hundreds, value",["Write 482 in a place value table.","Put 2 under ones, 8 under tens and 4 under hundreds.","Find each value: 400, 80 and 2.","Add them: 400 + 80 + 2 = 482."],"Place value tells you how much each digit is worth, which makes adding and comparing numbers easier.");
AD("maths",0,"Addition and subtraction","Adding and taking away in columns.","Work out 503 - 267.","Addition joins numbers and subtraction takes one away from another. Line up the digits by place and work from the right, carrying or borrowing when needed.","sum, difference, carry, borrow, column",["Add 276 + 148 and line up ones, tens and hundreds.","Ones: 6 + 8 = 14. Write 4 and carry 1.","Tens: 7 + 4 + 1 = 12. Write 2 and carry 1.","Hundreds: 2 + 1 + 1 = 4. The answer is 424."],"Working column by column keeps big sums neat and correct.");
AD("maths",0,"Multiplication tables","Multiplying as repeated addition.","Write out the 7 times table up to 7 x 10.","Multiplication is repeated addition. 6 x 4 means 6 added 4 times. Learning the tables helps you answer quickly.","product, factor, times table, repeated addition",["Write 6 x 4 as 6 + 6 + 6 + 6.","Add step by step: 6 + 6 = 12, 12 + 6 = 18, 18 + 6 = 24.","So 6 x 4 = 24.","Check with 4 x 6 = 24, because order does not matter."],"Knowing your tables saves time and builds the base for division, fractions and algebra.");
AD("maths",0,"Division","Sharing and grouping equally.","Share 45 sweets equally among 5 children.","Division shares or groups a number equally. 12 ÷ 3 asks how many groups of 3 fit into 12. It is the opposite of multiplication.","dividend, divisor, quotient, remainder",["Work out 20 ÷ 4.","Ask: 4 times what number is 20?","4 x 5 = 20, so 20 ÷ 4 = 5.","Check by multiplying: 5 x 4 = 20."],"Division undoes multiplication, so you can always check an answer by multiplying.");
AD("maths",0,"Fractions","Parts of a whole.","Shade and name 2/5 of a rectangle.","A fraction shows equal parts of a whole. In 3/4 the bottom number (denominator) tells how many equal parts there are, and the top number (numerator) tells how many we take.","numerator, denominator, half, quarter, equal parts",["Draw a rectangle and divide it into 4 equal parts.","Shade 3 of the parts.","Write the fraction 3/4.","Compare with 1/2: 3/4 is bigger because it covers more of the whole."],"Fractions describe equal parts, and drawing them makes them easy to compare.");
AD("english",0,"Nouns","Naming words for people, places and things.","Find 5 nouns in your classroom.","A noun names a person, place, animal or thing. Common nouns are general (girl, city). Proper nouns are specific names and start with a capital letter (Asha, Delhi).","noun, common noun, proper noun, capital letter",["Read: Asha bought a book in Delhi.","Find the person: Asha.","Find the thing: book.","Find the place: Delhi. Asha and Delhi are proper nouns."],"Nouns are the naming words, and spotting them helps you build clear sentences.");
AD("english",0,"Verbs","Action and state words.","Write 5 sentences using action verbs.","A verb is an action or state word. Run, eat and think are action verbs. Is, am and are show a state.","verb, action, tense, is, am, are",["Read: The boy kicks the ball.","Ask: what is the boy doing?","The answer is kicks, so kicks is the verb.","Change the tense: The boy kicked the ball."],"Every sentence needs a verb because it tells what happens.");
AD("english",0,"Adjectives","Words that describe nouns.","Describe your school bag using 4 adjectives.","An adjective describes a noun. It tells us what kind, how many or which one, like a red ball, three dogs or the tall tree.","adjective, describe, colour, size, number",["Start with: the dog.","Add a describing word: the brown dog.","Add another: the small brown dog.","Check that each adjective comes before the noun."],"Adjectives make writing clearer and more interesting.");
AD("english",0,"Singular and plural","One thing or many things.","Make the plural of: book, bus, city, man, tooth.","Singular means one and plural means more than one. Most words add s (cat, cats). Words ending in s, x, ch or sh add es (box, boxes). Some change spelling (child, children).","singular, plural, add s, add es, irregular",["Take the word box.","It ends in x, so add es: boxes.","Take the word child. It is irregular: children.","Say each plural in a sentence."],"Learn the common rules and the irregular words, and plurals become easy.");
AD("english",0,"Capital letters and punctuation","Starting and ending sentences correctly.","Correct this: my friend ravi plays cricket in mumbai","Start every sentence with a capital letter and end it with a full stop, question mark or exclamation mark. Names of people and places also begin with capital letters.","capital letter, full stop, question mark, exclamation mark",["Read: asha lives in delhi","Add capitals: Asha lives in Delhi","Add a full stop: Asha lives in Delhi.","Turn it into a question: Does Asha live in Delhi?"],"Capital letters and punctuation make writing easy to read.");

const PCD={cubes:[["A cube has how many faces? 🧊|6|Think of a dice.","A normal dice shows 6 on top. What number is on the bottom face? (Opposite faces add up to 7.)|1|7 minus 6.","A cube has how many corners?|8|Four on top and four on the bottom.","How many cubes are in this row? 🧊🧊🧊🧊🧊|5|Count them one by one."],["A cube has how many edges?|12|Four on top, four on the bottom and four joining them.","A dice shows 2 on top. What number is on the bottom?|5|Opposite faces add up to 7.","A tower has 3 layers. The bottom layer has 4 cubes, the middle has 3 and the top has 1. How many cubes in total?|8|4 + 3 + 1.","A 2 x 2 x 2 big cube is built from small cubes. How many small cubes does it have?|8|2 x 2 x 2."],["A 3 x 3 x 3 big cube is built from small cubes. How many small cubes does it have?|27|3 x 3 x 3.","The 3 x 3 x 3 cube is painted red on the outside. How many small cubes have no paint at all?|1|Only the hidden cube in the centre.","A cube has sides of 4 cm. What is its volume in cubic cm?|64|4 x 4 x 4.","A cube has sides of 3 cm. What is the area of one face in square cm?|9|3 x 3."]],patterns:[["What colour comes next? 🔴🔵🔴🔵🔴 ...|blue|The colours take turns.","Complete the pattern: 2, 4, 6, 8, ...|10|Add 2 each time.","What shape comes next? ⭐🟦⭐🟦⭐ ... (type star or square)|square|The shapes take turns.","Complete the pattern: 5, 10, 15, 20, ...|25|Add 5 each time."],["Complete the pattern: 1, 4, 9, 16, ...|25|Square numbers: 5 x 5.","Complete the pattern: 3, 6, 12, 24, ...|48|Double each time.","What colour comes next? 🟥🟥🟦🟥🟥🟦🟥🟥 ... (type red or blue)|blue|Two reds, then one blue.","Complete the pattern: 1, 1, 2, 3, 5, 8, ...|13|Add the last two numbers."],["Complete the pattern: 2, 6, 18, 54, ...|162|Multiply by 3.","Complete the pattern: 1, 2, 4, 7, 11, ...|16|The gap grows by 1 each time.","Complete the letters: A, C, E, G, ... (type one letter)|i|Skip one letter each time.","Complete the pattern: 100, 91, 82, 73, ...|64|Subtract 9 each time."]],images:[["🍎 + 🍎 = 10. What is one 🍎 worth?|5|10 shared between two.","Count the stars: ⭐⭐⭐⭐⭐⭐⭐|7|Count slowly.","Which animal is different? 🐱🐱🐶🐱 (type cat or dog)|dog|Three are cats.","How many 🐟 are there? 🐟🐠🐟🐟🐠|3|Count only the 🐟, not the 🐠."],["🍎 + 🍎 + 🍎 = 12 and 🍎 + 🍌 = 7. What is 🍌?|3|Each 🍎 is 4.","🐶 + 🐶 = 8 and 🐶 + 🐱 = 6. What is 🐱?|2|Each 🐶 is 4.","⚽ + ⚽ = 10 and ⚽ + 🏀 = 8. What is 🏀?|3|Each ⚽ is 5.","How many legs do 3 dogs 🐕🐕🐕 have altogether?|12|4 legs each, 3 dogs."],["🍎 + 🍎 + 🍎 = 30, 🍎 + 🍌 + 🍌 = 14 and 🍌 + 🍇 = 9. What is 🍇?|7|🍎 is 10, then 🍌 is 2.","🔺 + 🔺 + 🔺 = 18 and 🔺 + 🟦 + 🟦 = 14. What is 🟦?|4|🔺 is 6.","🐝 + 🐝 = 10, 🐝 + 🦋 = 9 and 🦋 + 🐞 = 6. What is 🐞?|2|🐝 is 5, then 🦋 is 4.","🧁 x 4 = 20, 🧁 + 🍪 = 9 and 🍪 + 🥤 = 10. What is 🥤?|6|🧁 is 5, then 🍪 is 4."]],real:[["I have hands but cannot clap. What am I?|clock|It tells the time.","How many days are in a week?|7|Monday to Sunday.","Which month comes after March?|april|Think of the calendar.","If today is Monday, what day is it two days later?|wednesday|Count forward."],["A train leaves at 9:15 and the trip takes 45 minutes. What time does it arrive? (type like 10:00)|10:00|15 + 45 = 60 minutes.","You buy 3 pencils at 5 rupees each and pay 20 rupees. How many rupees change do you get?|5|3 x 5 = 15.","A clock shows 3:00. What is the angle between the hands in degrees?|90|A quarter turn.","12 sweets are shared equally among 4 friends. How many does each friend get?|3|12 ÷ 4."],["A shop gives 20% off a 500 rupee shirt. What is the new price in rupees?|400|20% of 500 is 100.","A tap fills 5 litres per minute. How many minutes does it need to fill a 60 litre tank?|12|60 ÷ 5.","Ravi is twice as old as his sister. In 4 years the sum of their ages will be 20. How old is his sister now? (years)|4|Try sister = 4 and Ravi = 8.","You walk 2 km north, then 2 km east, then 2 km south. How many km are you from the start?|2|Only the east part is left."]]};

const G={

cs:s=>[`A cube has sides of ${s} cm. What is the total area of all 6 faces in square cm?`,""+6*s*s,"6 faces, each side x side."],

c2:n=>[`A ${n} x ${n} x ${n} cube is painted on the outside and cut into small cubes. How many small cubes have paint on exactly 2 faces?`,""+12*(n-2),"Each of the 12 edges has (n - 2) of them."],

pt:(i,L)=>[`What colour comes next? ${Array.from({length:L},(_,j)=>CL[i][j%2?2:0]).join("")} ... (type the colour name)`,CL[i][L%2?3:1],"The colours take turns."],
pl:(s,k)=>[`Complete the letters: ${[0,1,2,3].map(j=>LT[s+j*k].toUpperCase()).join(", ")}, ... (type one letter)`,LT[s+4*k],`Jump ${k} place${k>1?"s":""} in the alphabet each time.`],
ic:(i,n)=>[`How many ${e(i)} are there? ${(e(i)+e(i+5)).repeat(n)}`,""+n,`Count only the ${e(i)}.`],
ie:(i,v)=>[`${e(i)} + ${e(i)} = ${2*v}. What is one ${e(i)} worth?`,""+v,"Share the total between two."],

ia:(i,a,b,c)=>[`${e(i)} + ${e(i)} = ${2*a}, ${e(i)} + ${e(i+1)} = ${a+b} and ${e(i+1)} + ${e(i+2)} = ${b+c}. What is ${e(i+2)}?`,""+c,"Solve them one at a time."],
rm:m=>[`How many minutes are in ${m} hours?`,""+60*m,"1 hour is 60 minutes."],

AD("robotics",0,"Reading resistor colour codes","How the coloured bands tell you a resistor's value.","Read the value of three resistors using the colour chart.","A resistor has coloured bands. The first two bands are digits, the third band is the multiplier (how many zeros), and a gold or silver band at the end is the tolerance. Red, red, brown means 2, 2 and one zero: 220 ohms.","Assorted resistors, resistor colour chart, multimeter, paper and pencil",["Hold the resistor so the gold or silver band is on the right.","Read the first band as a digit (brown 1, red 2, orange 3, black 0).","Read the second band as a digit, then the third band as the number of zeros (brown 1 zero, red 2 zeros).","Write the value, for example orange, orange, brown is 330 ohms.","Check your answer by measuring the resistor with the multimeter on the ohms setting, with no power connected."],"Colour codes let you pick the right resistor quickly, and the multimeter proves your reading.");
AD("robotics",0,"Using a breadboard","How to build circuits without soldering.","Build an LED circuit on a breadboard.","A breadboard has holes joined inside by metal strips. The five holes in each short row are connected together, and the long rails at the sides carry power along the whole board. Parts in the same row are joined, so no soldering is needed.","Breadboard, 2 AA battery holder, red LED, 220 ohm resistor, jumper wires",["Push the LED's long leg into row 10 and its short leg into row 12.","Push one leg of the resistor into row 10 and the other leg into row 5 (a different row).","Connect the battery's red wire to row 5, using a jumper wire.","Connect the battery's black wire to row 12.","The LED lights. If it does not, check that each leg is in the right row and the LED is the right way round."],"A breadboard lets you build, test and change circuits quickly, which is how most robot circuits start.");
AD("robotics",0,"Making an electromagnet","How current in a coil makes a magnet you can switch on and off.","Compare how many paper clips 10 turns and 30 turns can lift.","When current flows through a coil of wire it makes a magnetic field. Wrapping the coil around an iron nail makes the field much stronger, so the nail becomes an electromagnet. More turns make a stronger magnet, and it switches off when the current stops.","Large iron nail, 1 metre of enamelled copper wire, 2 AA battery holder with switch, sandpaper, paper clips",["Wrap the wire in tight turns around the nail, starting 5 cm from one end. Make 10 turns first.","Rub the enamel off both wire ends with sandpaper.","Connect one wire end to the battery's red wire through the switch, and the other end to the black wire.","Close the switch, touch the nail to paper clips and count how many it lifts. Open the switch straight after.","Repeat with 30 turns and compare. The wire and nail can get warm, so switch off between tries."],"More turns and more current make a stronger electromagnet, which is used in cranes, relays and motors.");
AD("robotics",0,"Building a bristlebot","A tiny vibrating robot made from a toothbrush head.","Make a bristlebot that walks across the table.","A small motor with an off-centre weight shakes when it spins. The shaking and the angled bristles push the toothbrush head forward in small steps, so it walks without wheels.","Toothbrush head, 3 V vibration motor, 3 V battery holder or two AAA holder with switch, double-sided tape, craft eyes",["An adult cuts the head off an old toothbrush with the bristles still on it.","Stick the vibration motor on top of the head with double-sided tape, so the weighted end can spin freely.","Fix the battery holder next to the motor with tape.","Connect the battery's red wire to the switch, the switch to one motor wire, and the other motor wire to the battery's black wire.","Switch on and place it on a table. Bend the bristles slightly to make it turn."],"Vibration and angled bristles make a simple walking robot, with no wheels or gears needed. Keep small batteries away from young children.");
AD("robotics",0,"Paper circuit with copper tape","A flat circuit on paper that lights an LED.","Make a greeting card with a light-up LED.","Copper tape conducts electricity just like a wire. You can stick it on paper to make a flat circuit. The LED must be placed so its long leg touches the positive path, and a coin cell battery completes the circuit.","Card, copper tape, red LED, 3 V coin cell battery, binder clip, scissors",["Draw a line for the circuit on the card, with two tracks that stop near the LED spot.","Stick copper tape along the two tracks. Fold the tape at corners instead of cutting it, so it stays joined.","Place the LED so its long leg touches the track going to the battery's positive side and its short leg touches the other track.","Place the coin cell with the positive side up on the end of the positive track, touching the other track below it.","Close the card or hold it with a clip and the LED lights. An adult should supervise coin cells."],"A flat circuit on paper works exactly like wires and shows that the path must be complete for current to flow.");
AD("robotics",0,"Solar powered motor","How a solar panel can turn a small motor with sunlight.","Make a motor that spins only in sunlight.","A solar panel turns light energy into electrical energy. Joined to a small motor, it makes the motor spin when enough light falls on it. Less light means slower spinning, and swapping the wires reverses the direction.","Small solar panel (3 V), small DC motor, 2 jumper wires, small paper fan",["Join the solar panel's red (positive) wire to one motor terminal.","Join the solar panel's black (negative) wire to the other motor terminal.","Take it into sunlight, or under a bright lamp, and watch the motor spin.","Cover half of the panel with paper and see the motor slow down.","Swap the two wires on the motor and see it spin the other way."],"Solar panels give free power for robots, and the motor speed shows how much light the panel receives.");

if(IX_ADMIN_TAB==='sponsors') body=`<p class="sub">Add or remove sponsor cards shown under ✨ Creativity. Editing is saved in this browser only.</p><form id="ix-ad-form" class="admin-form"><h3>${IX_EDIT_AD?"Edit sponsor card":"Add a sponsor card"}</h3><input type="hidden" name="id" value="${ixEsc(IX_EDIT_AD)}"><label>Sponsor / brand name</label><input name="brand" required placeholder="Example: ABC Robotics"><label>Product title</label><input name="title" required placeholder="Starter robot kit"><label>Category</label><input name="category" placeholder="Robotics kit / Sensor / Tools"><label>Price display</label><input name="price" placeholder="₹999 or Contact sponsor"><label>Project name</label><input name="project" required placeholder="Obstacle-detection experiment"><label>30-second project overview</label><textarea name="overview" rows="3" required placeholder="Explain what students will learn..."></textarea><label>Sponsor contact link (https://, mailto:, or tel:)</label><input name="contact" placeholder="https://example.com/contact"><div class="row" style="margin-top:12px"><button class="btn">Save sponsor card</button><button class="btn out" type="button" data-ix-cancel>Clear form</button></div></form><h3>Current sponsor cards</h3>${ads.map(a=>`<div class="school"><h3>${ixEsc(a.title)}</h3><p>${ixEsc(a.brand)} · ${ixEsc(a.price||"No price")}</p><div class="row"><button class="btn out" data-ix-edit="${ixEsc(a.id)}">Edit</button><button class="btn out" data-ix-delete-ad="${ixEsc(a.id)}">Delete</button></div></div>`).join("")||'<p class="note">No sponsor cards yet.</p>'}`;
if(IX_ADMIN_TAB==='purchase') { const items=ixRead('ix_robot_purchase_contacts',[]); body=`<p class="sub">Add purchase information for a project. Students must open the project title confirmation first; no automatic redirect to YouTube.</p><form id="ix-purchase-form" class="admin-form"><h3>Add purchase option</h3><label>Project title (must match the project card)</label><input name="project" required placeholder="Exact robotics project title"><label>Product / seller name</label><input name="name" required value="InventoraX" placeholder="InventoraX"><label>Product details</label><textarea name="details" rows="3" required placeholder="What is included, price, and other details"></textarea><label>Chat with InventoraX — email (optional)</label><input name="email" type="email" placeholder="Add your email later"><label>Contact number (optional)</label><input name="phone" type="tel" placeholder="Add phone number later"><button class="btn" style="margin-top:12px">Save purchase option</button></form><h3>Saved purchase options</h3>${items.map((x,i)=>`<div class="school"><b>${ixEsc(x.project)}</b><p>${ixEsc(x.name||"InventoraX")}</p><p>${ixEsc(x.details)}</p><p>Chat email: ${ixEsc(x.email||"Not added yet")} · Phone: ${ixEsc(x.phone||"Not added yet")}</p><button class="btn out" data-ix-purchase-delete="${i}">Delete</button></div>`).join('')||'<p class="note">No purchase options saved yet.</p>'}`; }
if(IX_ADMIN_TAB==='courses') body=`<p class="sub">Create extra course cards. They will appear in Courses on this browser.</p><form id="ix-course-form" class="admin-form"><h3>Add a course</h3><label>Course title</label><input name="title" required><label>Level</label><select name="level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select><label>Description</label><textarea name="description" rows="3" required></textarea><label>Student task</label><input name="task" required><button class="btn" style="margin-top:12px">Add course</button></form><h3>Extra courses</h3>${courses.map((c,i)=>`<div class="school"><h3>${ixEsc(c.title)}</h3><p>${ixEsc(c.description)}</p><p><b>Task:</b> ${ixEsc(c.task)}</p><button class="btn out" data-ix-delete-course="${i}">Delete</button></div>`).join("")||'<p class="note">No extra courses added.</p>'}`;
if(IX_ADMIN_TAB==='questions') body=`<p class="sub">Add a multiple-choice question. It appears in the extra practice quiz on the Tests page.</p><form id="ix-question-form" class="admin-form"><h3>Add a quiz question</h3><label>Question</label><input name="question" required><label>Option A</label><input name="a" required><label>Option B</label><input name="b" required><label>Option C</label><input name="c" required><label>Correct option</label><select name="answer"><option value="0">A</option><option value="1">B</option><option value="2">C</option></select><button class="btn" style="margin-top:12px">Add question</button></form><h3>Saved questions</h3>${qs.map((q,i)=>`<div class="school"><h3>${ixEsc(q.question)}</h3><p>A. ${ixEsc(q.options[0])} · B. ${ixEsc(q.options[1])} · C. ${ixEsc(q.options[2])}</p><p><b>Correct:</b> ${"ABC"[q.answer]}</p><button class="btn out" data-ix-delete-question="${i}">Delete</button></div>`).join("")||'<p class="note">No custom questions yet.</p>'}`;
return `<h2 class="pg">🛠️ Content Admin</h2><p class="sub">Manage sponsor cards, additional courses and practice questions.</p><div class="note"><b>Important:</b> This is a local demo admin panel, not a secure online admin system. Anyone using this same browser can edit it. For a live school website, connect authenticated admin access and a shared database before publishing.</div>${ixAdminNav()}${body}`};
// Show admin-created courses in the regular course list.
const ixCoursesBase=V.courses;V.courses=()=>{const base=ixCoursesBase(),extra=ixRead(IX_STORE.courses,[]);if(!extra.length)return base;return base.replace(/<\/div>$/,extra.map(c=>`<div class="card"><span class="tag">${ixEsc(c.level||"Beginner")} · Added course</span><h3>${ixEsc(c.title)}</h3><p>${ixEsc(c.description)}</p><div class="task"><b>Task:</b> ${ixEsc(c.task)}</div></div>`).join("")+'</div>')};
const ixTestsBase=V.tests;V.tests=()=>{const base=ixTestsBase(),qs=ixRead(IX_STORE.questions,[]);if(!qs.length)return base;return base+`<h2 class="pg" style="margin-top:32px">Extra Practice Questions</h2><p class="sub">Questions added by your local admin.</p><form id="ix-extra-quiz" class="admin-form">${qs.map((q,i)=>`<fieldset style="border:0;padding:0;margin:0 0 16px"><legend><b>${i+1}. ${ixEsc(q.question)}</b></legend>${q.options.map((o,j)=>`<label style="font-weight:400"><input type="radio" name="ixq${i}" value="${j}" style="width:auto;margin-right:8px">${ixEsc(o)}</label>`).join("")}</fieldset>`).join("")}<button class="btn">Check extra answers</button><p id="ix-extra-result" role="status"></p></form>`};
// All interaction handlers for the added features.
document.addEventListener("click",e=>{
 const watch=e.target.closest("[data-ix-watch]");if(watch){const id=watch.dataset.ixWatch,a=ixAds().find(x=>x.id===id);if(!a)return;const ov=document.getElementById("ixoverview-"+id),pr=document.getElementById("ixprogress-"+id),bar=document.getElementById("ixbar-"+id),purchase=document.querySelector('[data-ix-purchase="'+id+'"]'),note=document.getElementById("ixpurchase-note-"+id);if(!ov||!pr||!bar)return;if(IX_TIMER){clearInterval(IX_TIMER);IX_TIMER=null}ov.hidden=false;if(purchase)purchase.style.display="none";if(note){note.style.display="inline";note.textContent="Please complete the 30-second overview to unlock purchase contact."}let left=15;watch.disabled=true;watch.textContent="Overview playing · 30s";pr.textContent="Sponsored project overview: "+left+" seconds remaining";bar.style.width="0%";IX_TIMER=setInterval(()=>{left--;pr.textContent=left>0?"Sponsored overview: "+left+" seconds remaining":"Overview completed!";bar.style.width=((15-left)/15*100)+"%";watch.textContent=left>0?"Overview playing · "+left+"s":"✓ Overview completed";if(left<=0){clearInterval(IX_TIMER);IX_TIMER=null;watch.disabled=false;ixWrite(IX_STORE.views,[...new Set([...ixRead(IX_STORE.views,[]),id])]);if(purchase&&ixContact(a.contact)){purchase.href=ixContact(a.contact);purchase.style.display="inline-flex";if(note)note.style.display="none"}else if(note){note.textContent="Overview complete. Owner purchase contact has not been added yet."}}},1000);return}
 const tab=e.target.closest("[data-ix-tab]");if(tab){IX_ADMIN_TAB=tab.dataset.ixTab;IX_EDIT_AD="";go("admin");return}
 const ed=e.target.closest("[data-ix-edit]");if(ed){const a=ixAds().find(x=>x.id===ed.dataset.ixEdit);if(!a)return;IX_EDIT_AD=a.id;go("admin");const f=document.getElementById("ix-ad-form");if(f)Object.entries(a).forEach(([k,v])=>{if(f.elements[k])f.elements[k].value=v});return}
 if(e.target.closest("[data-ix-cancel]")){IX_EDIT_AD="";go("admin");return}
 const da=e.target.closest("[data-ix-delete-ad]");if(da&&confirm("Delete this sponsor card?")){ixWrite(IX_STORE.ads,ixAds().filter(a=>a.id!==da.dataset.ixDeleteAd));IX_EDIT_AD="";go("admin");return}
 const pd=e.target.closest("[data-ix-purchase-delete]");if(pd){const x=ixRead("ix_robot_purchase_contacts",[]);x.splice(+pd.dataset.ixPurchaseDelete,1);ixWrite("ix_robot_purchase_contacts",x);go("admin");return}
 const dc=e.target.closest("[data-ix-delete-course]");if(dc){const x=ixRead(IX_STORE.courses,[]);x.splice(+dc.dataset.ixDeleteCourse,1);ixWrite(IX_STORE.courses,x);go("admin");return}
 const dq=e.target.closest("[data-ix-delete-question]");if(dq){const x=ixRead(IX_STORE.questions,[]);x.splice(+dq.dataset.ixDeleteQuestion,1);ixWrite(IX_STORE.questions,x);go("admin");return}
});
document.addEventListener("submit",e=>{
 const af=e.target.closest("#ix-ad-form");if(af){e.preventDefault();const f=new FormData(af),id=String(f.get("id")||"")||("ad-"+Date.now()),a={id,brand:String(f.get("brand")||"").trim(),title:String(f.get("title")||"").trim(),category:String(f.get("category")||"Robotics").trim(),price:String(f.get("price")||"Contact sponsor").trim(),project:String(f.get("project")||"").trim(),overview:String(f.get("overview")||"").trim(),contact:String(f.get("contact")||"").trim(),duration:30};const arr=ixAds(),ix=arr.findIndex(x=>x.id===id);if(ix>=0)arr[ix]=a;else arr.push(a);if(ixWrite(IX_STORE.ads,arr)){IX_EDIT_AD="";IX_ADMIN_TAB="sponsors";go("admin")}else alert("Could not save. Browser storage may be full.");return}
 const pf=e.target.closest("#ix-purchase-form");if(pf){e.preventDefault();const f=new FormData(pf),x=ixRead("ix_robot_purchase_contacts",[]);x.push({project:String(f.get("project")||"").trim(),name:String(f.get("name")||"InventoraX").trim(),details:String(f.get("details")||"").trim(),email:String(f.get("email")||"").trim(),phone:String(f.get("phone")||"").trim()});if(ixWrite("ix_robot_purchase_contacts",x)){IX_ADMIN_TAB="purchase";go("admin")}else alert("Could not save purchase option in this browser.");return}
 const cf=e.target.closest("#ix-course-form");if(cf){e.preventDefault();const f=new FormData(cf),x=ixRead(IX_STORE.courses,[]);x.push({title:String(f.get("title")).trim(),level:String(f.get("level")),description:String(f.get("description")).trim(),task:String(f.get("task")).trim()});ixWrite(IX_STORE.courses,x);go("admin");return}
 const qf=e.target.closest("#ix-question-form");if(qf){e.preventDefault();const f=new FormData(qf),x=ixRead(IX_STORE.questions,[]);x.push({question:String(f.get("question")).trim(),options:[String(f.get("a")).trim(),String(f.get("b")).trim(),String(f.get("c")).trim()],answer:+f.get("answer")});ixWrite(IX_STORE.questions,x);go("admin");return}
 const qz=e.target.closest("#ix-extra-quiz");if(qz){e.preventDefault();const qs=ixRead(IX_STORE.questions,[]);let score=0,answered=0;qs.forEach((q,i)=>{const v=qz.querySelector(`input[name="ixq${i}"]:checked`);if(v){answered++;if(+v.value===q.answer)score++}});const out=document.getElementById("ix-extra-result");if(out)out.textContent=`You answered ${answered} of ${qs.length}. Score: ${score}/${qs.length}.`;return}
});

const IX_ROBOT_PROGRESS_KEY="ix_robotics_level_progress_v1";

const IX_YOUTUBE_CHANNEL="https://www.youtube.com/@Sivaprasad-r8q";
const ixRobotVideoTarget=url=>{const u=String(url||"").trim();if(/youtube\.com\/(watch\?v=|shorts\/|embed\/)|youtu\.be\//i.test(u))return u;return IX_YOUTUBE_CHANNEL};
const IX_ROBOT_VIDEOS_KEY="ix_robot_project_videos_v1";
const ixRobotVideosRead=()=>{try{const x=JSON.parse(localStorage.getItem(IX_ROBOT_VIDEOS_KEY)||"{}");return x&&typeof x==="object"?x:{}}catch(e){return {}}};
const IX_ROBOT_IMAGES_KEY="ix_robot_project_images_v1";
function ixRobotImagesRead(){try{return JSON.parse(localStorage.getItem(IX_ROBOT_IMAGES_KEY)||"{}")}catch(e){return {}}}
const IX_STUDENT_WORK_IMAGES_KEY="ix_student_robot_work_images_v1";
function ixStudentWorkRead(){try{return JSON.parse(localStorage.getItem(IX_STUDENT_WORK_IMAGES_KEY)||"{}")}catch(e){return {}}}
function ixCurrentLearner(){try{const email=localStorage.getItem("ix_learner_session_v1"),accounts=JSON.parse(localStorage.getItem("ix_learner_accounts_v1")||"{}");return email&&accounts[email]?accounts[email]:null}catch(e){return null}}
function ixStudentWorkKey(email,id){return String(email||"").toLowerCase()+"::"+id}

t=ixRobotContact(title);return `<article class="card ad-card" style="opacity:${unlocked?1:.68}"><span class="tag">Project ${idx+1} · Level ${levelIndex+1}</span><h4>${ixEsc(title)}</h4>${projectImages[id]?`<img src="${projectImages[id]}" alt="${ixEsc(title)} project reference" style="display:block;width:100%;max-height:260px;object-fit:contain;background:#f5f7fb;border-radius:12px;margin:8px 0">`:`<div class="sub" style="padding:10px 0">Project reference image coming soon.</div>`}${SBA?`<form class="ix-project-image-form" data-ix-project-image-form="${id}" style="margin:8px 0"><label>Owner: upload project reference image</label><input type="file" name="projectImage" accept="image/*" required><div class="row" style="margin-top:6px"><button class="btn out" type="submit">Save reference image</button>${projectImages[id]?`<button class="btn out" type="button" data-ix-project-image-remove="${id}">Remove image</button>`:""}</div></form>`:""}<div class="task" style="margin:10px 0"><b>📸 My project photo</b><p class="sub">${student?`Upload a photo of your own ${ixEsc(title)} project. It is saved under your student account on this browser.`:"Sign in to your student account to upload a photo of your own project."}</p>${student?`${studentWork[ixStudentWorkKey(student.email,id)]?`<img src="${studentWork[ixStudentWorkKey(student.email,id)]}" alt="Your ${ixEsc(title)} project" style="display:block;width:100%;max-height:260px;object-fit:contain;background:#f5f7fb;border-radius:12px;margin:8px 0">`:""}<form data-ix-student-work-form="${id}" style="margin-top:8px"><label>Choose your project image (max 5 MB)</label><input type="file" name="studentWorkImage" accept="image/*" required><div class="row" style="margin-top:6px"><button class="btn out" type="submit">Upload my project photo</button>${studentWork[ixStudentWorkKey(student.email,id)]?`<button class="btn out" type="button" data-ix-student-work-remove="${id}">Remove my photo</button>`:""}</div><p class="sub" role="status" data-ix-s // Enhanced leaderboard: test completions, course purchase records, and daily consistency.
const ixLeaderboardBase=V.results;
const ixDailySeries=()=>{let events=[];try{events=JSON.parse(localStorage.getItem("ix_act")||"[]")}catch(e){}const today=new Date(),days=[];for(let i=13;i>=0;i--){const d=new Date(today);d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");const active=events.some(a=>{const t=new Date(a.t);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")===key});days.push({key,label:(d.getMonth()+1)+"/"+d.getDate(),active})}return days};
const ixDailyChart=days=>{const active=days.filter(d=>d.active).length,max=34;return `<div class="card" style="margin:14px 0"><div class="stats"><div class="stat"><b>${active}/14</b>active days in last 14 days</div><div class="stat"><b>${Math.round(active/14*100)}%</b>daily consistency</div><div class="stat"><b>${days[days.length-1].active?"Active today":"Not active today"}</b>today's activity</div></div><div style="display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:5px;align-items:end;margin-top:16px">${days.map(d=>`<div title="${d.key}: ${d.active?"Active":"No activity recorded"}" style="text-align:center;min-width:0"><div style="height:${d.active?max:8}px;background:${d.active?"var(--pri)":"var(--line)"};border-radius:5px 5px 2px 2px;margin:0 auto;width:100%;max-width:24px"></div><small style="display:block;font-size:9px;overflow:hidden;margin-top:5px;color:var(--muted)">${d.label}</small></div>`).join("")}</div><p class="sub" style="margin-top:12px">A day counts when the student completes a tracked learning activity on this browser. Shared daily history requires a connected database.</p></div>`};
V.results=()=>{const base=ixLeaderboardBase();let purchases=[];try{purchases=JSON.parse(localStorage.getItem("ix_course_purchases")||"[]")}catch(e){}const days=ixDailySeries();let localTests=0;try{localTests=JSON.parse(localStorage.getItem("ix_act")||"[]").filter(a=>a.k==="test").length}catch(e){};const html=base+`<section style="margin-top:30px"><h2 class="pg">📈 Student progress dashboard</h2><p class="sub">Track test completions, course purchases and steady day-by-day learning.</p><div id="ix-lb-metrics" class="stats"><div class="stat"><b id="ix-lb-tests">${localTests}</b>tests completed</div><div class="stat"><b id="ix-lb-purchases">${purchases.length}</b>course purchase records on this browser</div><div class="stat"><b>${days.filter(d=>d.active).length}/14</b>active days · last 14 days</div></div><h3 style="margin:24px 0 8px">📅 Daily consistency chart</h3>${ixDailyChart(days)}<h3 style="margin:24px 0 8px">🧾 Course purchases</h3><div id="ix-lb-purchase-list">${purchases.length?`<div class="scroll"><table><tr><th>Course</th><th>Date recorded</th><th>Status</th></tr>${purchases.slice().reverse().map(x=>`<tr><td>${esc(x.course||"Course")}</td><td>${esc(x.date||"")}</td><td>${esc(x.status||"Recorded locally")}</td></tr>`).join("")}</table></div>`:'<p class="note">No course purchase records are available yet. Purchases will only appear here after a checkout or admin workflow records them; this page does not process payments by itself.</p>'}</div><p class="note">Privacy and accuracy: browser-only activity and purchase records are visible only on this device. For a true all-student leaderboard across devices, connect student-authenticated database tables for daily activity and verified course orders.</p></section>`;setTimeout(async()=>{try{if(typeof sb!=="undefined"&&sb){const r=await sb.from("student_totals").select("tests");const el=document.getElementById("ix-lb-tests");if(el&&!r.error)el.textContent=(r.data||[]).reduce((n,x)=>n+(Number(x.tests)||0),0)}}catch(e){}},0);return html};
ixOwnerNav();
go("home");
</script>

<script>
/* Inventorax learner registration and sign-in flow */
(function(){
 const KEY='ix_learner_accounts_v1', SESSION='ix_learner_session_v1';
 const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}};
 const current=()=>{try{const email=localStorage.getItem(SESSION);return email?read()[email]||null:null}catch(e){return null}};
 const makeId=(name,email)=>{let base=(name||'STUDENT').toUpperCase().replace(/[^A-Z0-9]+/g,'').slice(0,4)||'STUD';return 'IX-'+base+'-'+Math.random().toString(36).slice(2,7).toUpperCase()};
 const oldProfile=V.profile;
 V.profile=()=>{const u=current();if(u)return `<h2 class="pg">My student dashboard</h2><p class="sub">Welcome, ${esc(u.name)}. Your learner account is signed in.</p><div class="card" style="padding:20px;margin:14px 0"><p style="margin:0 0 6px;color:var(--muted)">Your Inventorax Student ID</p><h2 style="font-size:30px;margin:0 0 8px">${esc(u.id)}</h2><p><b>Name:</b> ${esc(u.name)}<br><b>Email:</b> ${esc(u.email)}</p><button class="btn" type="button" data-go="path">Start learning</button> <button class="btn out" type="button" data-go="tests">Write a test</button> <button class="btn out" type="button" id="ix-learner-logout">Sign out</button></div><p class="note">Your account is currently saved in this browser only. To securely use the same ID on other devices, the website needs a real authentication database.</p>`;
 return `<h2 class="pg">Student sign in / registration</h2><p class="sub">Create your learner account first. Next time, sign in with your email and password.</p><div class="tabs" style="display:flex;gap:8px;margin:16px 0"><button type="button" class="btn" id="ix-tab-register">Register</button><button type="button" class="btn out" id="ix-tab-login">Sign in</button></div><form id="ix-register-form" style="max-width:480px"><h3>Create account</h3><label for="ix-reg-name">Full name</label><input id="ix-reg-name" required autocomplete="name" maxlength="80"><label for="ix-reg-email">Email</label><input id="ix-reg-email" type="email" required autocomplete="email"><label for="ix-reg-pass">Password</label><input id="ix-reg-pass" type="password" required minlength="6" autocomplete="new-password"><p class="note">Use at least 6 characters. This demo stores accounts only in this browser; do not use a password you use elsewhere.</p><p class="err" id="ix-auth-msg" role="status"></p><button class="btn">Register</button></form><form id="ix-login-form" style="max-width:480px;display:none"><h3>Sign in</h3><label for="ix-log-email">Email</label><input id="ix-log-email" type="email" required autocomplete="email"><label for="ix-log-pass">Password</label><input id="ix-log-pass" type="password" required autocomplete="current-password"><p class="err" id="ix-login-msg" role="status"></p><button class="btn">Sign in</button></form>`;
 };
 document.addEventListener('click',e=>{if(e.target.id==='ix-tab-register'){const a=document.getElementById('ix-register-form'),b=document.getElementById('ix-login-form');if(a&&b){a.style.display='';b.style.display='none'}}if(e.target.id==='ix-tab-login'){const a=document.getElementById('ix-register-form'),b=document.getElementById('ix-login-form');if(a&&b){a.style.display='none';b.style.display=''}}if(e.target.id==='ix-learner-logout'){localStorage.removeItem(SESSION);go('profile')}});
 document.addEventListener('submit',e=>{const f=e.target;if(f.id==='ix-register-form'){e.preventDefault();const name=document.getElementById('ix-reg-name').value.trim(),email=document.getElementById('ix-reg-email').value.trim().toLowerCase(),password=document.getElementById('ix-reg-pass').value,msg=document.getElementById('ix-auth-msg');const accounts=read();if(accounts[email]){msg.textContent='An account with this email already exists. Please sign in.';return}const u={name,email,password,id:makeId(name,email),createdAt:new Date().toISOString()};accounts[email]=u;try{localStorage.setItem(KEY,JSON.stringify(accounts));localStorage.setItem(SESSION,email);go('profile')}catch(err){msg.textContent='Could not save account in this browser. Please check available storage.'}}
 if(f.id==='ix-login-form'){e.preventDefault();const email=document.getElementById('ix-log-email').value.trim().toLowerCase(),password=document.getElementById('ix-log-pass').value,msg=document.getElementById('ix-login-msg'),u=read()[email];if(!u||u.password!==password){msg.textContent='Email or password is incorrect. If this is your first time, register first.';return}localStorage.setItem(SESSION,email);go('profile')}});
})();
</script>
<script>
/* Circular student avatar: clicking it opens emoji choices and photo selection. */
(function(){
 const PHOTO_KEY='ix_student_home_photo_v1', EMOJI_KEY='ix_student_home_emoji_v1';
 const emojis=['🧑‍🎓','👩‍🎓','👨‍🎓','🧒','👦','👧','🧑','👩','👨','🤖','🦊','🐼','🐯','🐸','🐵','🐱','🐶','🦄','🐻','🐨','🐰','🐼','⭐','🚀'];
 function paint(){const box=document.getElementById('ix-home-avatar');let data='',emoji='🧑‍🎓';try{data=localStorage.getItem(PHOTO_KEY)||'';emoji=localStorage.getItem(EMOJI_KEY)||emoji}catch(e){}if(box){box.innerHTML='';if(data){const img=document.createElement('img');img.src=data;img.alt='Student profile photo';img.style.cssText='width:100%;height:100%;object-fit:cover';box.appendChild(img)}else box.textContent=emoji;}const hero=document.querySelector('.circ .em2');if(hero){hero.innerHTML='';if(data){const img=document.createElement('img');img.src=data;img.alt='Your profile photo';img.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:50%;display:block';hero.appendChild(img);hero.style.cssText+=';overflow:hidden;border-radius:50%;display:flex;align-items:center;justify-content:center'}else{hero.textContent='🤖';hero.style.cssText+=';overflow:visible;border-radius:0'}}}
 function setup(){const list=document.getElementById('ix-avatar-emojis');if(list&&!list.dataset.ready){list.dataset.ready='1';list.innerHTML=emojis.map(x=>`<button type="button" data-avatar-emoji="${x}" aria-label="Choose ${x}" style="font-size:25px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:5px;cursor:pointer">${x}</button>`).join('')}paint()}
 document.addEventListener('click',e=>{const avatar=e.target.closest('#ix-home-avatar'),picker=document.getElementById('ix-avatar-picker');if(avatar&&picker){picker.style.display=picker.style.display==='block'?'none':'block';setup();return}const choice=e.target.closest('[data-avatar-emoji]');if(choice){try{localStorage.removeItem(PHOTO_KEY);localStorage.setItem(EMOJI_KEY,choice.dataset.avatarEmoji)}catch(err){}paint();const m=document.getElementById('ix-home-photo-msg');if(m)m.textContent='Avatar saved.';return}if(e.target.id==='ix-home-photo-remove'){try{localStorage.removeItem(PHOTO_KEY);localStorage.setItem(EMOJI_KEY,'🧑‍🎓')}catch(err){}paint();const m=document.getElementById('ix-home-photo-msg');if(m)m.textContent='Default student emoji restored.';return}if(picker&&!e.target.closest('#ix-avatar-picker'))picker.style.display='none'});
 document.addEventListener('change',e=>{if(e.target.id!=='ix-home-photo')return;const file=e.target.files&&e.target.files[0],msg=document.getElementById('ix-home-photo-msg');if(!file)return;if(!file.type.startsWith('image/')){if(msg)msg.textContent='Please choose an image file.';return}if(file.size>5*1024*1024){if(msg)msg.textContent='Please choose a photo smaller than 5 MB.';e.target.value='';return}const reader=new FileReader();reader.onload=()=>{const source=new Image();source.onload=()=>{try{const max=480,scale=Math.min(1,max/Math.max(source.naturalWidth,source.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(source.naturalWidth*scale));canvas.height=Math.max(1,Math.round(source.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.drawImage(source,0,0,canvas.width,canvas.height);const photo=canvas.toDataURL('image/jpeg',0.78);/* Show the selected image in the circular avatar immediately. */const box=document.getElementById('ix-home-avatar');if(box){box.innerHTML='';const img=document.createElement('img');img.src=photo;img.alt='Student profile photo';img.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:50%';box.appendChild(img)}const hero=document.querySelector('.circ .em2');if(hero){hero.innerHTML='';const heroImg=document.createElement('img');heroImg.src=photo;heroImg.alt='Your profile photo';heroImg.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:50%;display:block';hero.appendChild(heroImg);hero.style.cssText+=';overflow:hidden;border-radius:50%;display:flex;align-items:center;justify-content:center'}try{localStorage.setItem(PHOTO_KEY,photo);localStorage.removeItem(EMOJI_KEY);if(msg)msg.textContent='Profile photo displayed and saved in this browser.'}catch(storageError){if(msg)msg.textContent='Photo is displayed, but browser storage is full. It may not remain after refresh.'}}catch(err){if(msg)msg.textContent='Could not process this photo. Please try another image.'}};source.onerror=()=>{if(msg)msg.textContent='Could not read that photo. Please try another image.'};source.src=String(reader.result)};reader.onerror=()=>{if(msg)msg.textContent='Could not read that photo.'};reader.readAsDataURL(file)});
 const originalGo=window.go;if(typeof originalGo==='function'){window.go=function(){const r=originalGo.apply(this,arguments);setup();return r}}
 document.addEventListener('DOMContentLoaded',setup);setTimeout(setup,0);
})();
</script>
